<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SmartFlow — Вход</title>
    <link rel="stylesheet" href="/static/css/style.css">
</head>
<body>

<div class="auth-page">
    <!-- Left panel -->
    <div class="auth-hero">
        <div class="auth-hero__content">
            <div class="auth-hero__logo">N</div>
            <h1 class="auth-hero__title">SmartFlow</h1>
            <p class="auth-hero__subtitle">Умный агрегатор новостей из Telegram-каналов с AI-фильтрацией и кластеризацией</p>
            <div class="auth-hero__features">
                <div class="auth-hero__feature">
                    <span class="auth-hero__feature-icon">
                        <img src="/static/images/automate.svg" width="18" height="18">
                    </span>
                    <span>Автоматическая фильтрация нежелательного контента</span>
                </div>
                <div class="auth-hero__feature">
                    <span class="auth-hero__feature-icon">
                        <img src="/static/images/news.svg" width="18" height="18">
                    </span>
                    <span>Кластеризация новостей по категориям</span>
                </div>
                <div class="auth-hero__feature">
                    <span class="auth-hero__feature-icon">
                        <img src="/static/images/search.svg" width="18" height="18">
                    </span>
                    <span>Дедупликация и поиск по всем каналам</span>
                </div>
            </div>
        </div>
    </div>

    <!-- Right panel — auth form -->
    <div class="auth-form-area">
        <div class="auth-card">
            <!-- Tabs -->
            <div class="auth-tabs">
                <button class="auth-tab active" id="tab-login" onclick="switchTab('login')">Вход</button>
                <button class="auth-tab" id="tab-register" onclick="switchTab('register')">Регистрация</button>
            </div>

            <!-- Login form -->
            <form class="auth-form" id="form-login" onsubmit="return false;">
                <div class="auth-field">
                    <label class="auth-label" for="login-username">Имя пользователя</label>
                    <input class="auth-input" type="text" id="login-username" placeholder="Введите имя пользователя" autocomplete="username">
                </div>
                <div class="auth-field">
                    <label class="auth-label" for="login-password">Пароль</label>
                    <input class="auth-input" type="password" id="login-password" placeholder="Введите пароль" autocomplete="current-password">
                </div>
                <div class="auth-error" id="login-error"></div>
                <button class="auth-submit" type="submit" id="login-btn">Войти</button>
            </form>

            <!-- Register form -->
            <form class="auth-form" id="form-register" style="display:none;" onsubmit="return false;">
                <div class="auth-field">
                    <label class="auth-label" for="reg-username">Имя пользователя</label>
                    <input class="auth-input" type="text" id="reg-username" placeholder="Придумайте имя пользователя" autocomplete="username">
                </div>
                <div class="auth-field">
                    <label class="auth-label" for="reg-password">Пароль</label>
                    <input class="auth-input" type="password" id="reg-password" placeholder="Придумайте пароль" autocomplete="new-password">
                </div>
                <div class="auth-field">
                    <label class="auth-label" for="reg-password2">Повторите пароль</label>
                    <input class="auth-input" type="password" id="reg-password2" placeholder="Повторите пароль" autocomplete="new-password">
                </div>
                <div class="auth-error" id="register-error"></div>
                <button class="auth-submit" type="submit" id="register-btn">Создать аккаунт</button>
            </form>
        </div>
    </div>
</div>

<script src="/static/js/auth.js"></script>

</body>
</html>
