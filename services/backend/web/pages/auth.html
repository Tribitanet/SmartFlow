<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SmartFlow — Вход</title>
    <link rel="stylesheet" href="/static/css/style.css">
</head>
<body>

<div class="auth-page">
    <!-- Left panel -->
    <div class="auth-hero">
        <div class="auth-hero__content">
            <div class="auth-hero__logo">N</div>
            <h1 class="auth-hero__title">SmartFlow</h1>
            <p class="auth-hero__subtitle">Умный агрегатор новостей из Telegram-каналов с AI-фильтрацией и кластеризацией</p>
            <div class="auth-hero__features">
                <div class="auth-hero__feature">
                    <span class="auth-hero__feature-icon">
                        <img src="/static/images/automate.svg" width="18" height="18">
                    </span>
                    <span>Автоматическая фильтрация нежелательного контента</span>
                </div>
                <div class="auth-hero__feature">
                    <span class="auth-hero__feature-icon">
                        <img src="/static/images/news.svg" width="18" height="18">
                    </span>
                    <span>Кластеризация новостей по категориям</span>
                </div>
                <div class="auth-hero__feature">
                    <span class="auth-hero__feature-icon">
                        <img src="/static/images/search.svg" width="18" height="18">
                    </span>
                    <span>Дедупликация и поиск по всем каналам</span>
                </div>
            </div>
        </div>
    </div>

    <!-- Right panel — auth form -->
    <div class="auth-form-area">
        <div class="auth-card">
            <!-- Tabs -->
            <div class="auth-tabs">
                <button class="auth-tab active" id="tab-login" onclick="switchTab('login')">Вход</button>
                <button class="auth-tab" id="tab-register" onclick="switchTab('register')">Регистрация</button>
            </div>

            <!-- Login form -->
            <form class="auth-form" id="form-login" onsubmit="return false;">
                <div class="auth-field">
                    <label class="auth-label" for="login-username">Имя пользователя</label>
                    <input class="auth-input" type="text" id="login-username" placeholder="Введите имя пользователя" autocomplete="username">
                </div>
                <div class="auth-field">
                    <label class="auth-label" for="login-password">Пароль</label>
                    <input class="auth-input" type="password" id="login-password" placeholder="Введите пароль" autocomplete="current-password">
                </div>
                <div class="auth-error" id="login-error"></div>
                <button class="auth-submit" type="submit" id="login-btn">Войти</button>
            </form>

            <!-- Register form -->
            <form class="auth-form" id="form-register" style="display:none;" onsubmit="return false;">
                <div class="auth-field">
                    <label class="auth-label" for="reg-username">Имя пользователя</label>
                    <input class="auth-input" type="text" id="reg-username" placeholder="Придумайте имя пользователя" autocomplete="username">
                </div>
                <div class="auth-field">
                    <label class="auth-label" for="reg-password">Пароль</label>
                    <input class="auth-input" type="password" id="reg-password" placeholder="Придумайте пароль" autocomplete="new-password">
                </div>
                <div class="auth-field">
                    <label class="auth-label" for="reg-password2">Повторите пароль</label>
                    <input class="auth-input" type="password" id="reg-password2" placeholder="Повторите пароль" autocomplete="new-password">
                </div>
                <div class="auth-error" id="register-error"></div>
                <button class="auth-submit" type="submit" id="register-btn">Создать аккаунт</button>
            </form>
        </div>
    </div>
</div>

<script>
/* ===== REDIRECT IF ALREADY LOGGED IN ===== */
(function() {
    if (localStorage.getItem('sf_token')) {
        window.location.href = '/feed';
    }
})();

/* ===== TAB SWITCHING ===== */
function switchTab(tab) {
    const loginTab = document.getElementById('tab-login');
    const registerTab = document.getElementById('tab-register');
    const loginForm = document.getElementById('form-login');
    const registerForm = document.getElementById('form-register');

    if (tab === 'login') {
        loginTab.classList.add('active');
        registerTab.classList.remove('active');
        loginForm.style.display = 'flex';
        registerForm.style.display = 'none';
    } else {
        registerTab.classList.add('active');
        loginTab.classList.remove('active');
        registerForm.style.display = 'flex';
        loginForm.style.display = 'none';
    }

    // Clear errors
    document.getElementById('login-error').textContent = '';
    document.getElementById('register-error').textContent = '';
}

/* ===== LOGIN ===== */
document.getElementById('login-btn').addEventListener('click', async function() {
    const username = document.getElementById('login-username').value.trim();
    const password = document.getElementById('login-password').value;
    const errorEl = document.getElementById('login-error');

    errorEl.textContent = '';

    if (!username || !password) {
        errorEl.textContent = 'Заполните все поля';
        return;
    }

    this.disabled = true;
    this.textContent = 'Вход...';

    try {
        const res = await fetch('/auth/login', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ username, password }),
        });

        const data = await res.json();

        if (!res.ok) {
            errorEl.textContent = data.error || 'Ошибка входа';
            return;
        }

        // Save auth data — только токен и username
        localStorage.setItem('sf_token', data.token);
        localStorage.setItem('sf_username', data.username);

        window.location.href = '/feed';
    } catch (e) {
        errorEl.textContent = 'Ошибка соединения с сервером';
    } finally {
        this.disabled = false;
        this.textContent = 'Войти';
    }
});

/* ===== REGISTER ===== */
document.getElementById('register-btn').addEventListener('click', async function() {
    const username = document.getElementById('reg-username').value.trim();
    const password = document.getElementById('reg-password').value;
    const password2 = document.getElementById('reg-password2').value;
    const errorEl = document.getElementById('register-error');

    errorEl.textContent = '';

    if (!username || !password || !password2) {
        errorEl.textContent = 'Заполните все поля';
        return;
    }

    if (password !== password2) {
        errorEl.textContent = 'Пароли не совпадают';
        return;
    }

    if (password.length < 6) {
        errorEl.textContent = 'Пароль должен быть не менее 6 символов';
        return;
    }

    this.disabled = true;
    this.textContent = 'Создание...';

    try {
        const res = await fetch('/auth/register', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ username, password }),
        });

        const data = await res.json();

        if (!res.ok) {
            errorEl.textContent = data.error || 'Ошибка регистрации';
            return;
        }

        // Авто-логин с теми же username/password
        const loginRes = await fetch('/auth/login', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ username, password }),
        });

        const loginData = await loginRes.json();

        if (loginRes.ok) {
            localStorage.setItem('sf_token', loginData.token);
            localStorage.setItem('sf_username', loginData.username);
            window.location.href = '/feed';
        } else {
            switchTab('login');
        }
    } catch (e) {
        errorEl.textContent = 'Ошибка соединения с сервером';
    } finally {
        this.disabled = false;
        this.textContent = 'Создать аккаунт';
    }
});

/* Enter key submit */
document.querySelectorAll('.auth-input').forEach(input => {
    input.addEventListener('keydown', function(e) {
        if (e.key === 'Enter') {
            const form = this.closest('.auth-form');
            form.querySelector('.auth-submit').click();
        }
    });
});
</script>

</body>
</html>
