<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SmartFlow — Лента</title>
    <link rel="stylesheet" href="/static/css/style.css">
</head>
<body>

<!-- ===== SIDEBAR ===== -->
<nav class="sidebar">
    <div class="sidebar__top">
        <div class="sidebar__logo">N</div>
        <div class="sidebar__spacer"></div>
        <a href="/feed" class="sidebar__btn active">
            <img src="/static/images/news.svg" width="24" height="24">
            <span>News</span>
        </a>
        <a href="/automate" class="sidebar__btn">
            <img src="/static/images/automate.svg" width="24" height="24">
            <span>Automate</span>
        </a>
        <a href="/search" class="sidebar__btn">
            <img src="/static/images/search.svg" width="24" height="24">
            <span>Search</span>
        </a>
        <a href="/addfeed" class="sidebar__btn">
            <img src="/static/images/addfeed.svg" width="24" height="24">
            <span>Add feed</span>
        </a>
    </div>
    <div class="sidebar__bottom">
        <div class="sidebar__btn">
            <img src="/static/images/settings.svg" width="24" height="24">
            <span>Settings</span>
        </div>
        <div class="sidebar__spacer-sm"></div>
        <div class="sidebar__avatar" id="user-avatar">АД</div>
    </div>
</nav>

<!-- ===== CATEGORIES PANEL ===== -->
<aside class="categories-panel" id="categories-panel">
    <div class="categories-panel__header">
        <span class="categories-panel__title">News</span>
        <div class="categories-panel__edit-btn" id="edit-categories-btn">
            <img src="/static/images/folder-edit.svg" width="18" height="18">
        </div>
    </div>
    <div class="categories-panel__list" id="categories-list"></div>
</aside>

<!-- ===== CONTENT ===== -->
<main class="main-content">
    <div class="top-bar">
        <div class="top-bar__left">
            <span class="top-bar__title" id="news-topic-title">Все новости</span>
            <span class="top-bar__count" id="news-topic-count"></span>
        </div>
        <div class="read-toggle" id="read-toggle">
            <button class="read-toggle__btn active" data-filter="unread">Непрочитанные</button>
            <button class="read-toggle__btn" data-filter="read">Прочитанные</button>
        </div>
    </div>
    <div class="news-area">
        <div class="news-grid" id="news-grid">
            <div class="loading"><div class="loading__spinner"></div> Загрузка новостей...</div>
        </div>
    </div>
</main>

<!-- ===== NEWS DETAIL MODAL ===== -->
<div class="modal-overlay" id="news-modal" style="display:none;">
    <div class="modal-card">
        <!-- Header -->
        <div class="modal-header">
            <div class="modal-meta">
                <span class="modal-source" id="modal-source"></span>
                <span class="modal-time" id="modal-time"></span>
            </div>
            <button class="modal-close" id="modal-close-btn">&times;</button>
        </div>
        <div class="modal-divider"></div>
        <!-- Body -->
        <div class="modal-body">
            <h2 class="modal-title" id="modal-title"></h2>
            <div class="modal-text" id="modal-text"></div>
            <div class="modal-tag" id="modal-tag" style="display:none;"></div>
        </div>
        <div class="modal-divider"></div>
        <!-- Footer -->
        <div class="modal-footer">
            <div class="modal-actions">
                <button class="modal-action-btn" id="modal-save-btn">
                    <img src="/static/images/bookmark.svg" width="14" height="14" id="modal-save-icon">
                    <span>Сохранить</span>
                </button>
                <button class="modal-action-btn" id="modal-read-btn">
                    <img src="/static/images/eye.svg" width="14" height="14" id="modal-read-icon">
                    <span>Прочитано</span>
                </button>
                <div class="modal-dup-group" id="modal-dup-group" style="display:none;">
                    <div class="modal-dup-badge" id="modal-dup-badge">
                        <img src="/static/images/stack.svg" width="12" height="12">
                        <span id="modal-dup-count"></span>
                    </div>
                    <button class="modal-dup-arrow" id="modal-dup-prev">&#8249;</button>
                    <button class="modal-dup-arrow" id="modal-dup-next">&#8250;</button>
                </div>
            </div>
            <a class="modal-link-btn" id="modal-link" href="#" target="_blank">Открыть в Telegram →</a>
        </div>
    </div>
</div>

<script src="/static/js/api.js"></script>
<script src="/static/js/feed.js"></script>
</body>
</html>
