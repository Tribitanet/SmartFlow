services:
  database:
    image: postgres:18-alpine
    ports:
    - 5432:5432
    environment:
      POSTGRES_PASSWORD: ${PG_PASS}
      POSTGRES_USER: ${PG_USER}
    volumes:
      - pg_data:/var/lib/postgresql/data
  qdrant:
    image: qdrant/qdrant:latest
    ports: ["6333:6333", "6334:6334"]
    volumes:
      - qdrant_storage:/qdrant/storage

volumes:
  pg_data:
  qdrant_storage: